{% extends 'base.html' %}{% from 'macros.html' import csrf %}
{% block content %}<div class="page-heading"><div><h1>加入家庭账本</h1><p class="muted">加入时，历史账单自动保持私有，之后由你选择共享。</p></div></div><section class="panel form-panel"><form method="get"><label>邀请码<input name="token" value="{{ token }}" maxlength="100" required></label><button class="button secondary" type="submit">查看邀请</button></form>{% if invitation %}<hr><h2>加入“{{ invitation.name }}”</h2><p class="muted">此操作会离开原家庭；已有其他成员的家庭需先处理退出。</p><form method="post">{{ csrf() }}<input type="hidden" name="token" value="{{ token }}"><button class="button primary" type="submit">确认加入</button></form>{% elif token %}<p class="warning-text">邀请无效、已使用或已过期。</p>{% endif %}</section>{% endblock %}
