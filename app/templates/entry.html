{% extends 'base.html' %}{% from 'macros.html' import csrf,icon %}
{% block content %}<div class="page-heading"><div><div class="eyebrow">A LITTLE RECORD</div><h1>{{ '编辑账单' if record else '记一笔' }}</h1></div><a href="{{ url_for('web.entries') }}">返回明细</a></div><section class="panel form-panel"><form method="post">{{ csrf() }}<input type="hidden" name="nonce" value="{{ nonce }}"><div class="form-grid"><label>收支类型<select name="kind">{% for key,label in kind_names.items() %}<option value="{{ key }}" {{ 'selected' if record and record.kind==key else '' }}>{{ label }}</option>{% endfor %}</select></label><label>金额（元）<input name="amount" type="number" min="0.01" max="999999999.99" step="0.01" inputmode="decimal" required value="{{ '%.2f'|format(record.amount/100) if record else '' }}" placeholder="0.00"></label><label>名称 / 商家<input name="merchant" maxlength="120" required value="{{ record.merchant if record else '' }}" placeholder="例如：午餐"></label><label>分类<select name="category">{% if record and record.category not in categories %}<option selected>{{ record.category }}</option>{% endif %}{% for c in categories %}<option {{ 'selected' if record and record.category==c else '' }}>{{ c }}</option>{% endfor %}</select></label><label>日期与时间<input name="occurred" type="datetime-local" required value="{{ record.occurred[:16]|replace(' ','T') if record else default_date }}"></label><label>账户 / 支付渠道<input name="channel" list="channels" required maxlength="40" value="{{ record.channel if record else '微信' }}"><datalist id="channels"><option>微信</option><option>支付宝</option><option>银行卡</option><option>现金</option></datalist></label></div><label>备注<textarea name="note" maxlength="300" rows="2" placeholder="给这笔账加点说明（选填）">{{ record.note if record else '' }}</textarea></label><label class="checkbox"><input type="checkbox" name="shared" value="1" {{ 'checked' if record and record.shared else '' }}>与当前家庭共享这笔账单</label><p class="muted small">默认仅本人可见。退款按发生月份冲减所选分类支出；内部转账不计消费。</p><button class="button primary full" type="submit">{{ icon('check') }}保存账单</button></form>{% if record %}<form method="post" action="{{ url_for('web.delete_entry',entry_id=record.id) }}" data-confirm="确定将此账单移至回收站？">{{ csrf() }}<button class="button danger full" type="submit">移至回收站</button></form>{% endif %}</section>{% endblock %}
